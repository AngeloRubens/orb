name: ORB before/after

# Builds and tests the ORB with these changes, then runs the same RMI-IIOP
# load against GlassFish 8.0.4 with three ORB builds swapped in, on one
# runner: GlassFish as released, ORB master without these changes, and these
# changes. See perf/compare.sh for the configurations.

on:
  push:
    branches: [ perf/ci ]
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds (each runs every configuration once)
        default: "2"
      configs:
        description: Configurations
        default: "A B B64 C C64"
      scenarios:
        description: Scenarios
        default: "small graph large"
      beans:
        description: Beans (GreeterBean GreeterBmtBean GreeterSingletonBean)
        default: "GreeterBean"
      patched_ref:
        description: "Branch or SHA to build the changes under test from (empty means this branch)"
        default: ""
      baseline_ref:
        description: "Branch or SHA for config Cb, to measure one change against the stack under it (empty skips it)"
        default: ""
      pinning:
        description: "Cores for server/client: auto (half each, from 4 cores up), none, or taskset lists as server/client"
        default: "auto"

env:
  GLASSFISH_VERSION: 8.0.4
  MAVEN_ARGS: -B -ntp

jobs:
  tests:
    name: Unit tests (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test internal-api and orbmain
        run: mvn install -pl internal-api,orbmain -am

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'

  compare:
    name: Load comparison (build JDK 21, run JRE 25)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (to run)
        id: run-jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up JDK 21 (to build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Runner
        run: |
          {
            echo "### Runner"
            echo '```'
            nproc; free -g | head -2; lscpu | grep -E 'Model name|^CPU\(s\)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the ORB with these changes
        env:
          PATCHED_REF: ${{ inputs.patched_ref }}
        run: |
          mkdir -p jars
          # The harness lives on this branch; the changes under test may live
          # on another, so that a pull request carries only ORB sources.
          if [ -n "$PATCHED_REF" ]; then
            git fetch -q origin "$PATCHED_REF"
            git worktree add -q "$RUNNER_TEMP/orb-patched" FETCH_HEAD
            echo "Changes under test: $PATCHED_REF $(git -C "$RUNNER_TEMP/orb-patched" log -1 --format='%h %s')" >> "$GITHUB_STEP_SUMMARY"
            cd "$RUNNER_TEMP/orb-patched"
          fi
          mvn install -DskipTests -pl internal-api,orbmain -am
          cp orbmain/target/glassfish-corba-orb-*-SNAPSHOT.jar "$GITHUB_WORKSPACE/jars/orb-patched.jar"
          cp internal-api/target/glassfish-corba-internal-api-*-SNAPSHOT.jar "$GITHUB_WORKSPACE/jars/internal-api-patched.jar"

      - name: Build the ORB at the baseline ref
        # The changes under test sit on a stack of earlier ones, and against
        # master the newest change is a few percent inside the sum of all of
        # them. Naming its parent here gives config Cb, which differs from C by
        # that one change and nothing else.
        if: ${{ inputs.baseline_ref != '' }}
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          git fetch -q origin "$BASELINE_REF"
          git worktree add -q "$RUNNER_TEMP/orb-baseline" FETCH_HEAD
          echo "Baseline (config Cb): $BASELINE_REF $(git -C "$RUNNER_TEMP/orb-baseline" log -1 --format='%h %s')" >> "$GITHUB_STEP_SUMMARY"
          (cd "$RUNNER_TEMP/orb-baseline" && mvn install -DskipTests -pl internal-api,orbmain -am)
          cp "$RUNNER_TEMP"/orb-baseline/orbmain/target/glassfish-corba-orb-*-SNAPSHOT.jar jars/orb-baseline.jar
          cp "$RUNNER_TEMP"/orb-baseline/internal-api/target/glassfish-corba-internal-api-*-SNAPSHOT.jar jars/internal-api-baseline.jar

      - name: Build ORB master without these changes
        run: |
          git clone -q --depth 1 https://github.com/eclipse-ee4j/orb.git "$RUNNER_TEMP/orb-master"
          echo "ORB master: $(git -C "$RUNNER_TEMP/orb-master" log -1 --format='%h %s')" >> "$GITHUB_STEP_SUMMARY"
          (cd "$RUNNER_TEMP/orb-master" && mvn install -DskipTests -pl internal-api,orbmain -am)
          cp "$RUNNER_TEMP"/orb-master/orbmain/target/glassfish-corba-orb-*-SNAPSHOT.jar jars/orb-master.jar
          cp "$RUNNER_TEMP"/orb-master/internal-api/target/glassfish-corba-internal-api-*-SNAPSHOT.jar jars/internal-api-master.jar

      - name: Build orb-iiop ${{ env.GLASSFISH_VERSION }} with the GlassFish changes
        run: |
          git clone -q --depth 1 --branch "$GLASSFISH_VERSION" https://github.com/eclipse-ee4j/glassfish.git "$RUNNER_TEMP/glassfish"
          cd "$RUNNER_TEMP/glassfish"
          git apply "$GITHUB_WORKSPACE"/perf/gf-patches/*.patch
          mvn package -DskipTests -pl appserver/orb/orb-iiop
          cp appserver/orb/orb-iiop/target/orb-iiop.jar "$GITHUB_WORKSPACE/jars/orb-iiop-patched.jar"

      - name: Build orb-iiop ${{ env.GLASSFISH_VERSION }} with only the initial buffer size change
        if: contains(inputs.configs, 'B8d')
        run: |
          git clone -q --depth 1 --branch "$GLASSFISH_VERSION" https://github.com/eclipse-ee4j/glassfish.git "$RUNNER_TEMP/glassfish-buffer"
          cd "$RUNNER_TEMP/glassfish-buffer"
          git apply "$GITHUB_WORKSPACE"/perf/gf-patches-buffer/*.patch
          mvn package -DskipTests -pl appserver/orb/orb-iiop
          cp appserver/orb/orb-iiop/target/orb-iiop.jar "$GITHUB_WORKSPACE/jars/orb-iiop-buffer.jar"

      - name: Build Exousia from the fork, with and without the authorization change
        if: contains(inputs.configs, 'Bx')
        run: |
          for b in 3.x:exousia-3x perf/authorization-checks-3.x:exousia-patched; do
            ref=${b%%:*}; name=${b##*:}
            git clone -q --depth 1 --branch "$ref" https://github.com/AngeloRubens/exousia.git "$RUNNER_TEMP/$name"
            (cd "$RUNNER_TEMP/$name" && mvn package -DskipTests)
            cp "$RUNNER_TEMP/$name"/impl/target/exousia-*-SNAPSHOT.jar "jars/$name.jar"
          done
          ls -la jars/exousia-*.jar

      - name: Build orb-iiop ${{ env.GLASSFISH_VERSION }} with only the EJB service lookup change
        if: contains(inputs.configs, 'Be')
        run: |
          git clone -q --depth 1 --branch "$GLASSFISH_VERSION" https://github.com/eclipse-ee4j/glassfish.git "$RUNNER_TEMP/glassfish-ejbsvc"
          cd "$RUNNER_TEMP/glassfish-ejbsvc"
          git apply "$GITHUB_WORKSPACE"/perf/gf-patches-ejbsvc/*.patch
          mvn package -DskipTests -pl appserver/orb/orb-iiop
          cp appserver/orb/orb-iiop/target/orb-iiop.jar "$GITHUB_WORKSPACE/jars/orb-iiop-ejbsvc.jar"

      - name: Build the work queue as first rewritten, on LinkedTransferQueue
        # Only Bltq, Cltq and C64ltq install this jar. Building it for a run
        # that asked for none of them is four minutes of the runner spent on
        # a jar the comparison never loads.
        if: ${{ contains(inputs.configs || 'A B B64 C C64', 'ltq') }}
        run: |
          git worktree add -q "$RUNNER_TEMP/orb-ltq" "$LTQ_COMMIT"
          (cd "$RUNNER_TEMP/orb-ltq" && mvn install -DskipTests -pl internal-api -am)
          cp "$RUNNER_TEMP"/orb-ltq/internal-api/target/glassfish-corba-internal-api-*-SNAPSHOT.jar jars/internal-api-ltq.jar
        env:
          LTQ_COMMIT: a81e2b94

      - name: Build the ORB with every change except inline fragment processing
        if: ${{ contains(inputs.configs || 'A B B64 C C64', 'Cnf') }}
        run: |
          git worktree add -q "$RUNNER_TEMP/orb-noinline" "$NOINLINE_COMMIT"
          (cd "$RUNNER_TEMP/orb-noinline" && mvn install -DskipTests -pl orbmain -am)
          cp "$RUNNER_TEMP"/orb-noinline/orbmain/target/glassfish-corba-orb-*-SNAPSHOT.jar jars/orb-noinline.jar
        env:
          NOINLINE_COMMIT: 51bb5704

      - name: Install GlassFish ${{ env.GLASSFISH_VERSION }}
        run: |
          curl -sSL -o "$RUNNER_TEMP/glassfish.zip" \
            "https://github.com/eclipse-ee4j/glassfish/releases/download/${GLASSFISH_VERSION}/glassfish-${GLASSFISH_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/glassfish.zip" -d "$RUNNER_TEMP/gf"
          M="$RUNNER_TEMP/gf/glassfish8/glassfish/modules"
          cp "$M/glassfish-corba-orb.jar" jars/orb-released.jar
          cp "$M/glassfish-corba-internal-api.jar" jars/internal-api-released.jar
          cp "$M/orb-iiop.jar" jars/orb-iiop-released.jar
          ls -l jars

      - name: Build the test bean and the load client
        run: mvn package -f perf/pom.xml

      - name: Deploy the test bean
        env:
          JAVA_HOME: ${{ steps.run-jdk.outputs.path }}
          AS_JAVA: ${{ steps.run-jdk.outputs.path }}
        run: |
          GF="$RUNNER_TEMP/gf/glassfish8"
          "$GF/bin/asadmin" start-domain
          "$GF/bin/asadmin" deploy perf/bean/target/orb-baseline-bean.jar
          "$GF/bin/asadmin" stop-domain

      - name: Compare
        env:
          GF: ${{ runner.temp }}/gf/glassfish8
          JARS: ${{ github.workspace }}/jars
          CLIENT: ${{ github.workspace }}/perf/load/target/orb-load-client.jar
          RUN_JAVA: ${{ steps.run-jdk.outputs.path }}
          OUT: ${{ github.workspace }}/results/compare.txt
          JFR_DIR: ${{ github.workspace }}/results/jfr
          SCENARIOS: ${{ inputs.scenarios || 'small graph large' }}
          BEANS: ${{ inputs.beans || 'GreeterBean' }}
          PINNING: ${{ inputs.pinning || 'auto' }}
        run: |
          mkdir -p results
          # A probe that reports the logging status from inside the server.
          probe="$RUNNER_TEMP/logprobe"; mkdir -p "$probe/classes"
          javac -d "$probe/classes" perf/diag/LogStatusAgent.java perf/diag/Attach.java
          printf 'Agent-Class: LogStatusAgent\n' > "$probe/manifest.txt"
          jar cfm "$probe/logstatus-agent.jar" "$probe/manifest.txt" -C "$probe/classes" LogStatusAgent.class
          cp "$probe/classes/Attach.class" "$probe/"
          export LOG_PROBE="$probe" LOG_PROBE_JAVA="$JAVA_HOME"
          # Client and server on separate cores, so that neither takes CPU
          # from the other; see perf/compare.sh.
          case "$PINNING" in
            auto)
              n=$(nproc)
              if [ "$n" -ge 4 ]; then
                export CLIENT_CPUS=0-$((n / 2 - 1)) SERVER_CPUS=$((n / 2))-$((n - 1))
              fi ;;
            none) ;;
            */*) export SERVER_CPUS=${PINNING%/*} CLIENT_CPUS=${PINNING#*/} ;;
            *) echo "pinning must be auto, none or server/client, not $PINNING"; exit 1 ;;
          esac
          echo "Server CPUs: ${SERVER_CPUS:-not pinned}, client CPUs: ${CLIENT_CPUS:-not pinned}" | tee -a "$GITHUB_STEP_SUMMARY"
          perf/compare.sh "${{ inputs.rounds || '2' }}" ${{ inputs.configs || 'A B B64 C C64' }}

      - name: Summary
        if: always()
        run: |
          if [ -f results/compare.txt ]; then
            # Allocation and collections per recording, for the summary.
            for f in results/jfr/server-*.jfr; do
              [ -f "$f" ] || continue
              echo "$(basename "$f" .jfr) $(java perf/HeapAlloc.java "$f")"
            done > results/heap.txt
            python3 perf/summarize.py results/compare.txt | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Server log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/gf/glassfish8/glassfish/domains/domain1/logs/server.log" || true

      - name: Results and JFR recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-compare-results
          path: |
            results/
            jars/
